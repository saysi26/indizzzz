<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Deep VS 🤍 — La Sfida degli Indizi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700;800&family=Fraunces:ital,wght@0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0d0d;
    --surface: #161616;
    --surface2: #1e1e1e;
    --border: #2a2a2a;
    --gold: #f0c040;
    --gold2: #ffd96b;
    --red: #e84040;
    --green: #3ddc97;
    --blue: #5b9cf6;
    --text: #f0ede8;
    --muted: #7a7775;
    --dachshund: #c97b38;
    --sunflower: #f5c518;
    --boxing: #e84040;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    box-sizing: border-box;
  }

  *, *::before, *::after { box-sizing: inherit; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Space Grotesk', sans-serif;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none; z-index: 0;
  }

  .wrap { position: relative; z-index: 1; width: 100%; max-width: 680px; padding: 24px 16px 60px; }

  header { text-align: center; padding: 32px 0 20px; }
  .logo-emoji { font-size: 2.2rem; display: block; margin-bottom: 8px; }
  h1 {
    font-family: 'Fraunces', serif;
    font-size: clamp(1.9rem, 6vw, 2.8rem);
    font-weight: 700;
    line-height: 1.1;
    letter-spacing: -0.02em;
    background: linear-gradient(135deg, var(--gold) 0%, var(--gold2) 60%, #fff 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .subtitle { margin-top: 8px; color: var(--muted); font-size: 0.85rem; letter-spacing: 0.06em; }

  .screen { display: none; }
  .screen.active { display: block; }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px;
    margin-bottom: 16px;
  }
  .card-title {
    font-size: 0.7rem;
    letter-spacing: 0.12em;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 12px;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 14px 28px;
    border-radius: 12px;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 1rem;
    font-weight: 700;
    border: none;
    cursor: pointer;
    transition: transform 0.1s, opacity 0.15s;
    user-select: none;
    letter-spacing: 0.01em;
  }
  .btn:active { transform: scale(0.97); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
  .btn-gold { background: var(--gold); color: #0d0d0d; }
  .btn-gold:hover:not(:disabled) { background: var(--gold2); }
  .btn-outline { background: transparent; color: var(--text); border: 1.5px solid var(--border); }
  .btn-outline:hover:not(:disabled) { border-color: var(--gold); color: var(--gold); }
  .btn-full { width: 100%; }
  .btn-red { background: var(--red); color: #fff; }

  input[type="text"] {
    width: 100%;
    background: var(--surface2);
    border: 1.5px solid var(--border);
    color: var(--text);
    border-radius: 10px;
    padding: 13px 16px;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 1rem;
    outline: none;
    transition: border-color 0.15s;
    margin-bottom: 12px;
  }
  input[type="text"]:focus { border-color: var(--gold); }
  input[type="text"]::placeholder { color: var(--muted); }

  .scoreboard {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    gap: 12px;
    align-items: center;
    margin-bottom: 24px;
  }
  .score-player { text-align: center; }
  .score-name { font-size: 0.85rem; color: var(--gold2); letter-spacing: 0.08em; margin-bottom: 4px; font-weight:700;}
  .score-num {
    font-family: 'Fraunces', serif;
    font-size: 3rem;
    font-weight: 700;
    color: var(--gold);
    line-height: 1;
  }
  .score-vs { font-size: 0.85rem; color: var(--border); font-weight: 700; }

  .round-dots { display: flex; gap: 6px; justify-content: center; margin-bottom: 20px; }
  .round-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--border); transition: background 0.2s, transform 0.2s; }
  .round-dot.done { background: var(--gold); }
  .round-dot.current { background: var(--gold2); transform: scale(1.3); }

  .clue-reveal { background: var(--surface2); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; margin-bottom: 16px; }
  .clue-item { padding: 14px 18px; border-bottom: 1px solid var(--border); display: flex; align-items: flex-start; gap: 14px; }
  .clue-item:last-child { border-bottom: none; }
  .clue-num { font-family: 'Fraunces', serif; font-size: 1.4rem; color: var(--gold); min-width: 28px; line-height: 1.2; }
  .clue-text { font-size: 0.95rem; line-height: 1.5; color: var(--text); padding-top: 2px; }

  .theme-badge {
    display: inline-flex; align-items: center; gap: 8px; padding: 8px 16px; border-radius: 999px; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.04em; margin-bottom: 16px;
  }
  .theme-dachshund { background: rgba(201,123,56,0.18); color: var(--dachshund); border: 1px solid rgba(201,123,56,0.3); }
  .theme-sunflower { background: rgba(245,197,24,0.15); color: var(--sunflower); border: 1px solid rgba(245,197,24,0.25); }
  .theme-boxing { background: rgba(232,64,64,0.15); color: var(--boxing); border: 1px solid rgba(232,64,64,0.25); }
  .theme-mix { background: rgba(91,156,246,0.15); color: var(--blue); border: 1px solid rgba(91,156,246,0.25); }

  .turn-banner {
    background: var(--surface2); border: 1px solid var(--gold); border-radius: 12px; padding: 12px; text-align: center; font-weight: 700; color: var(--gold); margin-bottom: 16px;
  }

  .alert { padding: 12px 16px; border-radius: 10px; font-size: 0.88rem; margin-bottom: 14px; background: rgba(232,64,64,0.1); border: 1px solid rgba(232,64,64,0.3); color: var(--red); display: none; }
  .alert.show { display: block; }

  .penitenza-option {
    background: var(--surface2); border: 1.5px solid var(--border); border-radius: 12px; padding: 14px 18px; margin-bottom: 10px; cursor: pointer; transition: border-color 0.15s; font-size: 0.9rem; line-height: 1.4;
  }
  .penitenza-option:hover, .penitenza-option.selected { border-color: var(--gold); background: rgba(240,192,64,0.1); }

  .trophy { font-size: 5rem; display: block; text-align: center; margin: 16px 0 8px; }
  .winner-name { font-family: 'Fraunces', serif; font-size: 2.2rem; text-align: center; color: var(--gold); margin-bottom: 6px; }
  .winner-sub { text-align: center; color: var(--muted); font-size: 0.9rem; margin-bottom: 24px; }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <span class="logo-emoji">🥊🌻🐕</span>
    <h1>Deep vs ❤️<br>La Sfida degli Indizi</h1>
    <p class="subtitle">sfida locale a due giocatori</p>
  </header>

  <!-- HOME SCREEN -->
  <div id="screen-home" class="screen active">
    <div class="card">
      <div class="card-title">Inserisci i Nomi</div>
      <div class="alert" id="home-alert"></div>
      <input type="text" id="p1-name" placeholder="Nome Giocatore 1" maxlength="15">
      <input type="text" id="p2-name" placeholder="Nome Giocatore 2" maxlength="15">
      <button class="btn btn-gold btn-full" onclick="startGame()" style="margin-top:8px">Inizia la Partita 🚀</button>
    </div>
  </div>

  <!-- GAME SCREEN -->
  <div id="screen-game" class="screen">
    <div class="scoreboard">
      <div class="score-player">
        <div class="score-name" id="score-name-p1">P1</div>
        <div class="score-num" id="score-p1">0</div>
      </div>
      <div class="score-vs">VS</div>
      <div class="score-player">
        <div class="score-name" id="score-name-p2">P2</div>
        <div class="score-num" id="score-p2">0</div>
      </div>
    </div>

    <div class="round-dots" id="round-dots"></div>
    <div id="theme-badge" class="theme-badge theme-mix">🎯 Round in corso</div>
    <div id="turn-banner" class="turn-banner">Torn di: Giocatore</div>

    <div class="clue-reveal" id="clue-list"></div>

    <div style="display:flex; gap:10px; margin-bottom:16px;">
      <button class="btn btn-outline" style="flex:1" id="btn-next-clue" onclick="nextClue()">+1 Indizio 🔍</button>
    </div>

    <div class="card">
      <div class="card-title">Tenta la risposta</div>
      <div style="display:flex; gap:10px">
        <input type="text" id="answer-input" placeholder="Scrivi la risposta..." style="margin-bottom:0" onkeydown="if(event.key==='Enter')submitAnswer()">
        <button class="btn btn-gold" onclick="submitAnswer()">Invia</button>
      </div>
      <div id="answer-feedback" style="font-size:0.85rem; margin-top:8px; font-weight:700"></div>
    </div>

    <button class="btn btn-outline btn-full" id="btn-pass-turn" onclick="passTurn()" style="display:none">Passa il turno all'altro giocatore 🔄</button>
  </div>

  <!-- FINAL SCREEN -->
  <div id="screen-final" class="screen">
    <span class="trophy">🏆</span>
    <div class="winner-name" id="final-winner">---</div>
    <div class="winner-sub" id="final-sub"></div>

    <div class="card" id="penitenza-card" style="display:none">
      <div class="card-title">Scegli la Penitenza per lo sconfitto 😈</div>
      <div id="penitenza-list"></div>
      <button class="btn btn-red btn-full" onclick="confirmPenitenza()" style="margin-top:10px">Assegna Penitenza</button>
    </div>

    <div class="card" id="assigned-penitenza-card" style="display:none; text-align:center">
      <div class="card-title">Penitenza Assegnata!</div>
      <div id="assigned-penitenza-text" style="font-size:1.1rem; font-weight:700; color:var(--gold2)"></div>
    </div>

    <button class="btn btn-outline btn-full" onclick="location.reload()" style="margin-top:16px">Nuova Partita 🔄</button>
  </div>
</div>

<script>
let p1 = '', p2 = '';
let scoreP1 = 0, scoreP2 = 0;
let currentRound = 0;
let currentClue = 0;
let currentPlayer = 1; // 1 or 2
let rounds = [];

const PENITENZE = [
  "🎤 Cantare una canzone a scelta dell'avversario per 30 secondi",
  "🐶 Fare la faccia da bassotto triste per 1 minuto",
  "📸 Offrire la colazione o un caffè al vincitore alla prima occasione",
  "🥊 Fare 15 squat di fila senza fermarsi",
  "🗣️ Parlare solo usando versi di animali per i prossimi 3 minuti"
];

const ROUND_POOL = [
  { label: 'Bassotti', emoji: '🐶', themeClass: 'theme-dachshund', answer: 'bassotto', clues: [
    "Sono un animale domestico famoso per il corpo lunghissimo e zampe corte.",
    "Nato in Germania per cacciare i tassi nelle tane sotterranee.",
    "Ha orecchie lunghe e morbide e muso allungato.",
    "Esiste a pelo corto, duro e lungo.",
    "Viene simpaticamente chiamato 'salsiccia'."
  ]},
  { label: 'Girasoli', emoji: '🌻', themeClass: 'theme-sunflower', answer: 'girasole', clues: [
    "Pianta con un grande fiore giallo brillante.",
    "Da giovane ruota la testa per seguire la luce del sole.",
    "I suoi semi producono un olio usato in cucina.",
    "Van Gogh gli ha dedicato una serie di quadri celeberrimi.",
    "Lo stelo può superare anche i 3 metri d'altezza."
  ]},
  { label: 'Boxe', emoji: '🥊', themeClass: 'theme-boxing', answer: 'boxe', clues: [
    "Sport da combattimento che si svolge su un ring.",
    "Gli atleti indossano guantoni imbottiti.",
    "I round durano tipicamente 3 minuti.",
    "Campioni famosi: Muhammad Ali e Mike Tyson.",
    "Jab, cross, gancio e uppercut sono i colpi principali."
  ]},
  { label: 'Cultura Generale', emoji: '🎯', themeClass: 'theme-mix', answer: 'pizza', clues: [
    "Piatto simbolo della cucina italiana nel mondo.",
    "Classicamente tonda, cotta in forno a legna ad alte temperature.",
    "La Margherita contiene pomodoro, mozzarella e basilico.",
    "Nata a Napoli, la sua arte è patrimonio UNESCO.",
    "Esiste anche in teglia, fritta e al trancio."
  ]},
  { label: 'Cultura Generale', emoji: '🎯', themeClass: 'theme-mix', answer: 'gelato', clues: [
    "Dolce freddo e cremoso estivo.",
    "Servito tipicamente in cono o coppetta.",
    "Gusti famosi: pistacchio, nocciola, stracciatella.",
    "L'Italia è famosa nel mondo per la sua produzione artigianale.",
    "Contiene latte, panna, zucchero e aromi."
  ]}
];

function startGame() {
  p1 = document.getElementById('p1-name').value.trim();
  p2 = document.getElementById('p2-name').value.trim();
  if(!p1 || !p2) {
    const a = document.getElementById('home-alert');
    a.textContent = 'Inserisci entrambi i nomi!';
    a.classList.add('show');
    return;
  }
  rounds = [...ROUND_POOL];
  document.getElementById('score-name-p1').textContent = p1;
  document.getElementById('score-name-p2').textContent = p2;
  
  showScreen('game');
  initRound();
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-'+id).classList.add('active');
}

function initRound() {
  currentClue = 0;
  document.getElementById('answer-input').value = '';
  document.getElementById('answer-feedback').textContent = '';
  document.getElementById('btn-pass-turn').style.display = 'none';

  const round = rounds[currentRound];
  const badge = document.getElementById('theme-badge');
  badge.className = 'theme-badge ' + round.themeClass;
  badge.innerHTML = round.emoji + ' ' + round.label;

  updateDots();
  updateTurnUI();
  renderClues();
}

function updateDots() {
  const dots = document.getElementById('round-dots');
  dots.innerHTML = '';
  rounds.forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'round-dot' + (i === currentRound ? ' current' : (i < currentRound ? ' done' : ''));
    dots.appendChild(d);
  });
}

function updateTurnUI() {
  const name = currentPlayer === 1 ? p1 : p2;
  document.getElementById('turn-banner').textContent = `È il turno di: ${name}`;
}

function renderClues() {
  const round = rounds[currentRound];
  const list = document.getElementById('clue-list');
  list.innerHTML = '';

  for(let i = 0; i <= currentClue; i++) {
    const item = document.createElement('div');
    item.className = 'clue-item';
    item.innerHTML = `<div class="clue-num">${i+1}</div><div class="clue-text">${round.clues[i]}</div>`;
    list.appendChild(item);
  }
  
  document.getElementById('btn-next-clue').disabled = (currentClue >= 4);
}

function nextClue() {
  if(currentClue < 4) {
    currentClue++;
    renderClues();
  }
}

function submitAnswer() {
  const input = document.getElementById('answer-input');
  const val = input.value.trim().toLowerCase();
  if(!val) return;

  const correct = rounds[currentRound].answer.toLowerCase();
  const feedback = document.getElementById('answer-feedback');

  if(val === correct || val.includes(correct) || correct.includes(val)) {
    const pts = Math.max(6 - (currentClue + 1), 1);
    if(currentPlayer === 1) scoreP1 += pts; else scoreP2 += pts;
    
    document.getElementById('score-p1').textContent = scoreP1;
    document.getElementById('score-p2').textContent = scoreP2;

    feedback.style.color = 'var(--green)';
    feedback.textContent = `✓ Esatto! +${pts} punti a ${currentPlayer === 1 ? p1 : p2}!`;
    
    setTimeout(() => {
      currentRound++;
      if(currentRound >= rounds.length) {
        endGame();
      } else {
        initRound();
      }
    }, 1500);
  } else {
    feedback.style.color = 'var(--red)';
    feedback.textContent = `✗ Risposta errata! Turno passato.`;
    document.getElementById('btn-pass-turn').style.display = 'block';
  }
}

function passTurn() {
  currentPlayer = currentPlayer === 1 ? 2 : 1;
  document.getElementById('answer-input').value = '';
  document.getElementById('answer-feedback').textContent = '';
  document.getElementById('btn-pass-turn').style.display = 'none';
  updateTurnUI();
}

function endGame() {
  showScreen('final');
  const winnerEl = document.getElementById('final-winner');
  const subEl = document.getElementById('final-sub');
  
  if(scoreP1 > scoreP2) {
    winnerEl.textContent = `${p1} Vince! 🏆`;
    subEl.textContent = `Punteggio: ${scoreP1} a ${scoreP2}`;
    setupPenitenze();
  } else if(scoreP2 > scoreP1) {
    winnerEl.textContent = `${p2} Vince! 🏆`;
    subEl.textContent = `Punteggio: ${scoreP2} a ${scoreP1}`;
    setupPenitenze();
  } else {
    winnerEl.textContent = `Pareggio! 🤝`;
    subEl.textContent = `Punteggio: ${scoreP1} a ${scoreP2}`;
  }
}

let selectedP = '';
function setupPenitenze() {
  document.getElementById('penitenza-card').style.display = 'block';
  const list = document.getElementById('penitenza-list');
  list.innerHTML = '';
  PENITENZE.forEach((p) => {
    const div = document.createElement('div');
    div.className = 'penitenza-option';
    div.textContent = p;
    div.onclick = () => {
      document.querySelectorAll('.penitenza-option').forEach(x => x.classList.remove('selected'));
      div.classList.add('selected');
      selectedP = p;
    };
    list.appendChild(div);
  });
}

function confirmPenitenza() {
  if(!selectedP) { alert('Scegli una penitenza!'); return; }
  document.getElementById('penitenza-card').style.display = 'none';
  document.getElementById('assigned-penitenza-card').style.display = 'block';
  document.getElementById('assigned-penitenza-text').textContent = selectedP;
}
</script>
</body>
</html>
